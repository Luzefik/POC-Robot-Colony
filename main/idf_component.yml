## IDF Component Manager Manifest File
dependencies:
  idf:
    version: '>=5.1.0'
  # Pinned to the majors resolved in dependencies.lock; '*' would silently
  # pull breaking versions.
  espressif/esp32-camera: '^2.1.4'
  espressif/esp_jpeg: '^1.3.1'
  # Stable per-robot hostnames for the debug stream (http://ugv-XXXX.local/)
  espressif/mdns: '^1.8.0'
